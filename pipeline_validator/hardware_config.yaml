# ELENOR pipeline_validator 硬件配置（HardwareConfig 默认值，单一事实来源）。
# 参数取值来自 design/ 规格；未冻结项（由后续规格冻结 / 由 SRAM profile 冻结 /
# 由 PPA exploration 冻结）取 First Silicon V1 推荐值，保证基线仿真可复现。
schema_version: 1

system:
  profile: balanced-small # 12.3 config table

  topology:
    tiles_per_group: 4 # assignment scope: one group with four tiles

  clock:
    # 单一主时钟驱动 cycle-accurate 计数器；1 GHz 为建模基线。
    core_mhz: 1000.0

memory:
  hbm:
    capacity_bytes: 17179869184 # 16 GB，由后续规格冻结
    bandwidth_gbs: 819.2 # 8 HBM stacks * 102.4 GB/s
    outstanding_limit: 32 # tag CAM depth，由 PPA exploration 冻结
    channels: 8 # 8 HBM stacks，由后续规格冻结
    fixed_latency_cycles: 200 # 由后续规格冻结
    burst_bytes: 64 # 2^6，由后续规格冻结

  group_sram:
    capacity_bytes: 8388608 # 8 MB Balanced-small (12.3)
    banks: 16
    access_latency_cycles: 4 # 由 SRAM profile 冻结
    bank_bandwidth_gbs: 12.8 # per-bank，由 SRAM profile 冻结

  tile_l1:
    capacity_bytes: 1048576 # 1 MB Balanced-small (12.3)
    banks: 16 # 12.4 banking
    bandwidth_gbs: 512.0 # per-tile SRAM read peak，frozen later
    access_latency_cycles: 1 # 由 SRAM profile 冻结

  tile_program_sram:
    capacity_bytes: 65536 # hot tile kernel，由 SRAM profile 冻结

engines:
  boa:
    opa:
      count: 4
      rows: 16
      cols: 16

    clock_multiplier: 1.0

    dtype:
      input_bytes: 2 # BF16 input
      accumulator_bytes: 4 # INT32 / BF16 accumulate

    launch_cycles: 4

  evu:
    lanes: 32
    clock_multiplier: 1.0
    dtype_bytes: 2 # BF16
    launch_cycles: 3

  mfe:
    bandwidth_gbs: 256.0 # page/segment stream into L1
    clock_multiplier: 1.0
    launch_cycles: 3
    pipeline_depth: 4 # per-channel descriptor-accept queue depth

    command_queues:
      load_depth: 1 # UCE -> MFE load ingress FIFO
      store_depth: 1 # UCE -> MFE store ingress FIFO

    channels:
      load: 1 # 并行 load channel 数，V1 基线 1；由 SRAM/NoC profile 冻结
      store: 1 # 并行 store channel 数，V1 基线 1
    # 0 = unfrozen / non-enforcing baseline（由 SRAM profile 冻结）。
    stream_buffer_bytes: 0

  use:
    clock_mhz: 500.0
    state_cache_bytes: 131072
    launch_cycles: 2

control:
  tile_uce:
    clock_mhz: 1000.0
    dispatch_per_cycle: 1

  slot_frame:
    bind_cycles: 8 # slot frame 3.2 FSM

fabric:
  # 当前 validator 的 group-level HBM <-> L2 DMA 模型。
  dma:
    bandwidth_gbs: 204.8 # per-channel peak，frozen later
    channels: 2
    launch_cycles: 2
    descriptor_cycles: 2 # T_desc
    issue_cycles: 1 # T_issue
    completion_cycles: 1 # T_completion

  noc:
    vc_depth: 8 # 由 PPA exploration 冻结
    router_latency_cycles: 4 # NoC design 3.2

  stream_queue:
    default_depth: 3
    token_overhead_cycles: 1
    fence_cycles: 1

runtime:
  host:
    validate_cycles: 50 # package validate，由后续规格冻结
    patch_cycles: 10

  kernel_driver:
    doorbell_latency_cycles: 5

  firmware:
    fetch_cycles: 3
    validate_cycles: 5
