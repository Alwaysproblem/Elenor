version: 1
# Per-lane retire record, DRAFT (C010 / W2-01).
#
# One record per retiring instruction per lane. Consumed READ-ONLY by W7-01
# (trace schema) and W7-02 (native ISA oracle). The record is the upstream RVVI
# trace interface plus per-Context identity. The upstream part is checked
# against RvviTrace.scala itself: every upstream signal must be accounted for
# here, either carried (`required` or optional) or explicitly `excluded` with a
# reason. Deleting a carried field, or leaving an upstream signal unlisted, is a
# validation failure.
status: draft
lanes:
  count_param: retirementLanes
  value: 8
  source: { file: hdl/chisel/src/coralnpu/Parameters.scala, line: 142 }

# The blackbox in RvviTrace.scala is the authority for the upstream signal set.
upstream_trace:
  source:
    { file: hdl/chisel/src/coralnpu/RvviTrace.scala, class: RvviTraceBlackBox }
  suffix: _i
  per_lane: true

fields:
  # --- identity added for CS1 (not in upstream) ---
  - {
      name: ctx_slot,
      width_rule: "ctx_bits",
      origin: nexus_added,
      owner: W2,
      consumers: [W7],
      required: true,
    }
  - {
      name: ctx_generation,
      width_rule: "unresolved",
      origin: nexus_added,
      owner: W2,
      consumers: [W7],
      required: true,
    }
  - {
      name: owner_op_seq,
      width_rule: "unresolved",
      origin: nexus_added,
      owner: W2,
      consumers: [W7],
      required: true,
    }
  - {
      name: rob_tag,
      width_rule: "log2Ceil(retirementBufferSize)",
      origin: nexus_added,
      owner: W2,
      consumers: [W7],
      required: true,
    }
  - {
      name: flags_delta,
      width_rule: "6",
      origin: nexus_added,
      owner: W2,
      consumers: [W7],
      required: true,
      note: "fflags (5) + vxsat (1); merged only at retire (ctx_ctrl.yaml csr_commit.flags_delta)",
    }
  - {
      name: uop_pc,
      width_rule: "programCounterBits",
      origin: nexus_added,
      owner: W2,
      consumers: [W7],
      required: false,
      note: "sub-operation program position for RVV expansion",
    }
  # --- carried from the upstream RVVI trace ---
  - {
      name: valid,
      upstream_signal: valid,
      width_rule: "1",
      origin: upstream,
      owner: W2,
      consumers: [W7],
      required: true,
    }
  - {
      name: order,
      upstream_signal: order,
      width_rule: "64",
      origin: upstream,
      owner: W2,
      consumers: [W7],
      required: true,
    }
  - {
      name: insn,
      upstream_signal: insn,
      width_rule: "instructionBits",
      origin: upstream,
      owner: W2,
      consumers: [W7],
      required: true,
    }
  - {
      name: trap,
      upstream_signal: trap,
      width_rule: "1",
      origin: upstream,
      owner: W2,
      consumers: [W7],
      required: true,
    }
  - {
      name: pc_rdata,
      upstream_signal: pc_rdata,
      width_rule: "programCounterBits",
      origin: upstream,
      owner: W2,
      consumers: [W7],
      required: true,
    }
  - {
      name: x_wdata,
      upstream_signal: x_wdata,
      width_rule: "scalarRegCount * xlen",
      origin: upstream,
      owner: W2,
      consumers: [W7],
      required: true,
    }
  - {
      name: x_wb,
      upstream_signal: x_wb,
      width_rule: "scalarRegCount",
      origin: upstream,
      owner: W2,
      consumers: [W7],
      required: true,
    }
  - {
      name: f_wdata,
      upstream_signal: f_wdata,
      width_rule: "floatRegCount * xlen",
      origin: upstream,
      owner: W2,
      consumers: [W7],
      required: false,
    }
  - {
      name: f_wb,
      upstream_signal: f_wb,
      width_rule: "floatRegCount",
      origin: upstream,
      owner: W2,
      consumers: [W7],
      required: false,
    }
  - {
      name: v_wdata,
      upstream_signal: v_wdata,
      width_rule: "rvvRegCount * rvvVlen",
      origin: upstream,
      owner: W2,
      consumers: [W7],
      required: false,
    }
  - {
      name: v_wb,
      upstream_signal: v_wb,
      width_rule: "rvvRegCount",
      origin: upstream,
      owner: W2,
      consumers: [W7],
      required: false,
    }

# Upstream signals deliberately NOT carried, each with a reason. A signal that is
# neither carried above nor listed here makes the contract invalid.
excluded_upstream:
  - { upstream_signal: clk, reason: "clock, not a record field" }
  - {
      upstream_signal: debug_mode,
      reason: "debug-mode retire is out of scope for CS1 scalar-phase oracle comparison; revisit with W6 debug export",
    }
  - {
      upstream_signal: t_wdata,
      reason: "VME tile write data; owned by the W3 numeric contract (C011), not the W2 scalar record",
    }
  - {
      upstream_signal: t_wb,
      reason: "VME tile write-back mask; owned by W3 (C011)",
    }
  - {
      upstream_signal: csr,
      reason: "per-CSR write data is carried as flags_delta plus the ctx_ctrl csr_commit classes in this phase",
    }
  - { upstream_signal: csr_wb, reason: "CSR write-back mask; same as csr" }

mode_requirement:
  retirement_buffer_mode: full
  reason: "only full mode exposes per-instruction retire data; mini mode has inst = 0 and data = 0"
  source: { file: hdl/chisel/src/coralnpu/RetirementBuffer.scala, line: 74 }
  also:
    {
      file: hdl/chisel/src/coralnpu/RetirementBuffer.scala,
      line: 371,
      note: "dataWidth is 0 when mini, so no result data is kept",
    }
read_only_for: [W7]

# Parameters the width rules above are evaluated with. Each is read back from the
# pinned tree; xlen is a constructor default and is checked as such.
width_parameters:
  - {
      name: xlen,
      value: 32,
      source: { file: hdl/chisel/src/coralnpu/Parameters.scala, line: 71 },
      anchor: "xlen: Int = 32",
    }
  - {
      name: instructionBits,
      value: 32,
      source: { file: hdl/chisel/src/coralnpu/Parameters.scala, line: 76 },
    }
  - {
      name: programCounterBits,
      value: 32,
      source: { file: hdl/chisel/src/coralnpu/Parameters.scala, line: 75 },
      anchor: "def programCounterBits = xlen",
    }
  - {
      name: rvvVlen,
      value: 128,
      source: { file: hdl/chisel/src/coralnpu/Parameters.scala, line: 100 },
    }
