# P0 workload registry (C005). Expected outcomes are hand-computable and
# checked through the unmodified core's tohost path (exit code of the sim).
schema: cn_p0_workloads/v1
workloads:
  - name: hello_world_add_floats
    elf: examples/coralnpu_v2_hello_world_add_floats.elf
    origin: upstream example @ f795221
    inputs: ".data zero-initialized (upstream ELF, unmodified)"
    expected_exit: 0
    expected_outputs: "8 x 0.0f (0.0 + 0.0 per lane)"
  - name: p0_scalar_add
    elf: nexus_p0/p0_scalar_add.elf
    origin: kernels/p0 overlay (nonzero hand-computable inputs)
    inputs: "input1={1,2,3,4,5,6,7,8}f input2={0.5,1,1.5,2,0.25,0.5,1,2}f"
    expected_exit: 0
    expected_outputs: "1.5,3,4.5,6,5.25,6.5,8,10 (binary32, self-checked in-ELF; mismatch returns 2 -> sim exit 1)"
