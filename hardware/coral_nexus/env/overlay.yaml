# Overlay files copied into the derived work root at materialize time.
# Entries:
#   source: lock source name (coralnpu | coralnpu-compiler)
#   src:    repository-root-relative path of the overlay file
#   dst:    path inside that source's work tree
#   mode:   add        -> dst must NOT exist in the upstream tree
#          overwrite  -> dst MUST exist in the upstream tree
schema: cn_overlay/v1
entries:
  - source: coralnpu
    src: hardware/coral_nexus/env/overlay/coralnpu/nexus_p0/BUILD.bazel
    dst: nexus_p0/BUILD.bazel
    mode: add
  - source: coralnpu
    src: hardware/coral_nexus/kernels/p0/p0_scalar_add.cc
    dst: nexus_p0/p0_scalar_add.cc
    mode: add
  - source: coralnpu
    src: hardware/coral_nexus/env/overlay/coralnpu/tests/cocotb/vme_test/p0_kat/BUILD
    dst: tests/cocotb/vme_test/p0_kat/BUILD
    mode: add
  - source: coralnpu
    src: hardware/coral_nexus/env/overlay/coralnpu/tests/cocotb/vme_test/p0_kat/p0_bf16_kat_bench.py
    dst: tests/cocotb/vme_test/p0_kat/p0_bf16_kat_bench.py
    mode: add
