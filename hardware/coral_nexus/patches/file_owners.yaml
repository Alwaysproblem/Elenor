# Which package may patch which upstream paths. Any file touched by a patch
# in the series must match exactly one owner; two different owners claiming
# the same file is rejected by verify_sources.sh.
# Note: Python fnmatch '*' matches '/', so top-level files are listed explicitly
# to stay strictly disjoint from `scalar/Lsu.scala` (W4) and `rvv/` (W3).
schema: cn_patch_owners/v1
