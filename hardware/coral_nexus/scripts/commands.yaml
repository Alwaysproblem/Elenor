# Single registry of implemented cn commands (C003).
# Each command declares an executor and a handler; the dispatcher refuses
# anything not listed here with exit 3 (unknown) or exit 4 (registered but
# not yet implemented). Exit-code semantics live here, not in handlers.
schema: cn_commands/v1
exit_codes:
  0: success
  1: checker or assertion failure
  2: usage error
  3: unknown command, suite or missing prerequisite
  4: registered but not implemented yet
commands:
  env:
    summary: build/verify the locked container
    executor: host
    handler: scripts/handlers/env.sh
    subcommands: [build, verify, export, offline-rebuild, devcontainer-probe]
  sources:
    summary: verify the pinned source lock
    executor: host
    handler: scripts/handlers/sources.sh
    subcommands: [verify]
  verify:
    summary: validate evidence identity from a manifest
    executor: host
    handler: scripts/handlers/verify.sh
    pass_through: true
  gate:
    summary: run a registered stage gate
    executor: host
    handler: scripts/handlers/gate.sh
    pass_through: true
  baseline:
    summary: run P0 workloads on the unmodified upstream core
    executor: host
    handler: scripts/handlers/baseline.sh
    requires_config: true
  bf16-baseline:
    summary: run BF16 VME matmul test on the unmodified core
    executor: host
    handler: scripts/handlers/bf16_baseline.sh
  unit:
    summary: run a registered unit suite
    executor: host
    handler: scripts/handlers/unit.sh
    suites:
      environment:
        tests:
          - hardware/coral_nexus/verification/environment/test_sources.py
          - hardware/coral_nexus/verification/environment/test_environment.py
      dispatch:
        tests:
          - hardware/coral_nexus/verification/environment/test_dispatch.py
      baseline:
        tests:
          - hardware/coral_nexus/verification/baseline/test_baseline.py
      contracts:
        tests:
          - hardware/coral_nexus/verification/contracts/test_target_constraints.py
          - hardware/coral_nexus/verification/contracts/test_g0_gate.py
          - hardware/coral_nexus/verification/contracts/test_protocol_c009.py
          - hardware/coral_nexus/verification/contracts/test_native_owner_c010.py
