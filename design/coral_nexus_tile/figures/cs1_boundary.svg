<text x="480" y="678" text-anchor="middle" class="heading">一个可变状态只有一个执行 owner；checker 不代写数据、不代发完成。</text>
<text x="480" y="715" text-anchor="middle" class="note">唯一时间权威：Python Simulator cycle；一个 tick 对应一个 RTL 核心时钟周期。</text>
