<title id="title">Elenor 演进路线</title>
<desc id="desc">五个阶段依次推进：现在（文档驱动架构阶段）、短期（冻结 V1 cutline / ABI / SRAM profile）、中期（打通 GEMM + softmax + paged attention canonical path）、中长期（MoE / 多模型并发 / 多芯片扩展）、远期（更强 collective / HBM cache / chiplet / 轻训练）。</desc>
