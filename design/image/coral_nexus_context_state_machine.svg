<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 930" width="940" height="930" style="font-family:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei','Source Han Sans SC',sans-serif;font-size:15px" role="img" aria-labelledby="title desc">
<title id="title">Tile Context 生命周期状态机</title>
<desc id="desc">Context 状态：FREE、ADMITTED、INIT、READY、WAIT_EVENT、WAIT_RESOURCE、DRAINING、TERMINAL。主路径 FREE→ADMITTED→INIT→READY；READY 与 WAIT_EVENT、WAIT_RESOURCE 互转；终止、取消、故障或初始化失败进入 DRAINING，再经 TERMINAL 回到 FREE。ADMITTED 提交内部失败自回滚到 FREE。</desc>
<defs><marker id="m-e" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0 L10 5 L0 10 Z" fill="#374151"/></marker><marker id="m-s" viewBox="0 0 10 10" refX="0" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10 0 L0 5 L10 10 Z" fill="#374151"/></marker></defs>
