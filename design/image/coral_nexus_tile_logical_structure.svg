<text x="50" y="762" font-size="13" fill="#4b5563">箭头：主要请求／数据／完成方向；双头箭头：往返访问；左侧通道：完成汇聚回到 Context 状态表与 Tile 任务接收。</text>
<text x="50" y="782" font-size="13" fill="#4b5563">Tile 任务接收 → Group 的上行箭头：完成／阶段信号上报。</text>
