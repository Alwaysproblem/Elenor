<text x="20" y="30" font-size="20" fill="#111827" font-weight="bold">Nexus Tile 逻辑结构（Coral 派生）</text>
<text x="20" y="54" font-size="13" fill="#4b5563">逻辑职责图，不要求物理独立；程序装载路径与数据路径分离，见 RES-17／RES-18。</text>
