<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 800" width="760" height="800" style="font-family:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei','Source Han Sans SC',sans-serif;font-size:15px" role="img" aria-labelledby="title desc">
<title id="title">Nexus Tile 逻辑结构（Coral 派生）</title>
<desc id="desc">Group 准入到 Tile 任务接收、Context 状态表与 UCE；程序驻留与独立装载服务经本地指令存储进入 UCE；UCE 调度 Scalar、RVV、LSU/MFE，RVV 驱动 VME；LSU/MFE 与 Tile 本地存储、Group L2 互连往返；各执行单元汇聚到完成与事件，再回到 Context 状态表和 Tile 任务接收，并向 Group 上报。逻辑职责图，非物理布局。</desc>
