<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 800" width="960" height="800" style="font-family:'Noto Sans CJK SC','PingFang SC','Microsoft YaHei','Source Han Sans SC',sans-serif;font-size:15px" role="img" aria-labelledby="title desc">
<title id="title">共享 AM 顶层结构</title>
<desc id="desc">从 UCE / Context Scheduler 到共享 AM 表与设备 Ready 仲裁，再分发到 Engine 0 至 3；各 Engine 结果经结果路由与仲裁写入 AM group 0 至 3，再汇入输出 drain 写到已准入的 L1 输出区域；输出 drain 以虚线通知共享 AM 表。</desc>
