# Dual-mode L2 target for l2-admission-profile-switch (plan/03 §1.1).
# 16 banks, 4096 B/Bank system reserved, 327680 B total physical group SRAM.
# mode0: user L2 = (20480 - 4096) * 16 = 262144 B (SPM only).
# mode1: user L2 = (12288 - 4096) * 16 = 131072 B; the released 8192 B/Bank
# becomes read-only cache. SPM + cache = 20480 B/Bank in both modes, so the
# hardware total is unchanged and a live L2 backing is never migrated.
schema_version: 2
memory:
  target:
    profile_command_timeout_cycles: 2000000
    l2:
      system_reserved_spm_per_bank: 4096
      reset_mode: 0
      spm_mapping_id: striped_arena_v0
      cache_org_id: profiled_lru_v0
      cache_write_policy: read_only
      maintenance_caps: [invalidate_range, clean_invalidate_all, bypass]
  profile_source:
    l2:
      modes:
        0: { spm_bytes_per_bank: 20480, cache_bytes_per_bank: 0 }
        1: { spm_bytes_per_bank: 12288, cache_bytes_per_bank: 8192 }
  group_sram:
    capacity_bytes: 327680
