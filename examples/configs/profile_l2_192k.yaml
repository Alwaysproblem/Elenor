# Small-pool experiment target for n04_fifo_hol / s09_single_exact.
# L1 inherits bundled defaults; L2 is a single mode0 with 16 banks,
# 4096 B/Bank system reserved, and 16384 B/Bank total SPM
# (user L2 = (16384 - 4096) * 16 = 196608 B; total physical = 262144 B).
schema_version: 2
memory:
  target:
    profile_command_timeout_cycles: 2000000
    l2:
      system_reserved_spm_per_bank: 4096
      reset_mode: 0
      spm_mapping_id: striped_arena_v0
      cache_org_id: profiled_lru_v0
      cache_write_policy: read_only
      maintenance_caps: [invalidate_range, clean_invalidate_all, bypass]
  profile_source:
    l2:
      modes:
        0: { spm_bytes_per_bank: 16384, cache_bytes_per_bank: 0 }
  group_sram:
    capacity_bytes: 262144
